apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: express-api-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dev126712/express-api-CD.git
    path: 
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
