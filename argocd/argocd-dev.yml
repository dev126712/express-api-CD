apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: express-api-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dev126712/express-api-CD.git
    path: kustomization-dev
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:         
      prune: true      
      selfHeal: true  
