apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../base/frontend

namePrefix: dev-

commonLabels:
  env: development

replicas:
  - name: frontend
    count: 1


patches:
- target:
    kind: Deployment
    name: frontend
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          memory: "125Mi"
          cpu: "100m"
        limits:
          memory: "250Mi"
          cpu: "150m"
