apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../base/backend

namePrefix: dev-

labels:
  pairs:
    env: development
  includeSelector: true

replicas:
  - name: backend
    count: 1


patches:
- target:
    kind: Deployment
    name: backend
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          memory: "125Mi"
          cpu: "100m"
        limits:
          memory: "250Mi"
          cpu: "150m"