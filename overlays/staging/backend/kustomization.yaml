apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../base/backend

namePrefix: stag-

labels:
  - pairs:
      env: staging
    includeSelectors: true

replicas:
  - name: backend
    count: 2

namespace: staging

patches:
- target:
    kind: Deployment
    name: backend
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources
      value:
        requests:
          memory: "256Mi"
          cpu: "150m"
        limits:
          memory: "512Mi"
          cpu: "300m"
